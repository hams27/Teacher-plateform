<div class="nav-user d-flex align-items-center gap-3" *ngIf="auth.ready()">
  <ng-container *ngIf="auth.currentUser() as u; else guest">
    <a routerLink="/admin" class="nu-link" *ngIf="auth.isAdmin()">لوحة التحكم</a>
    <a routerLink="/progress" class="nu-link">تقدمي</a>
    <a routerLink="/favorites" class="nu-link">♥ المفضلة</a>
    <span class="nu-name" [title]="u.email || ''">{{ auth.displayName() || u.email }}</span>
    <button type="button" class="nu-btn" (click)="logout()">خروج</button>
  </ng-container>

  <ng-template #guest>
    <a routerLink="/login" class="nu-link">دخول</a>
    <a routerLink="/register" class="nu-cta">حساب جديد</a>
  </ng-template>
</div>
