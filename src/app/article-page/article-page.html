<app-site-nav></app-site-nav>

<div class="read-progress" aria-hidden="true"></div>

<section class="article-wrap">
  <div class="hero-deco" aria-hidden="true"><span class="glow"></span><span class="big-star"></span><i class="p p1"></i><i class="p p2"></i><i class="p p3"></i></div>

  <div class="container">
    <div class="loading-box" *ngIf="state() === 'loading'">
      <span class="visually-hidden">جاري التحميل...</span>
      <i class="sk s1"></i><i class="sk s2"></i><i class="sk s3"></i><i class="sk s4"></i><i class="sk s5"></i>
    </div>

    <div class="text-center py-5 notfound" *ngIf="state() === 'notfound'">
      <span class="empty-star" aria-hidden="true"></span>
      <h1 class="article-title nf">المقالة مش موجودة</h1>
      <p class="muted">اللينك ده غلط أو المقالة اتشالت</p>
      <a routerLink="/articles" class="btn btn-brass shine px-4 py-3 mt-3">كل المقالات</a>
    </div>

    <article class="article-box" *ngIf="state() === 'ready' && article() as a">
      <nav class="crumbs in-up" style="--d:.05s">
        <a routerLink="/">الرئيسية</a> <i class="sep"></i> <a routerLink="/articles">المقالات</a>
      </nav>
      <p class="article-meta in-up" style="--d:.15s">
        <span class="cat" *ngIf="a.category">{{ a.category }}</span>
        <span class="date" *ngIf="date">{{ date }}</span>
      </p>
      <h1 class="article-title"><span class="ln"><span class="w" style="--d:.25s">{{ a.title }}</span></span></h1>
      <div class="orn in-up" style="--d:.5s" aria-hidden="true"><span class="line"></span><span class="star"></span><span class="line"></span></div>
      <div class="article-body in-up" style="--d:.65s">{{ a.body }}</div>
      <div class="end-orn" aria-hidden="true"><span class="line"></span><span class="star"></span><span class="line"></span></div>
      <a routerLink="/articles" class="back-link"><span class="arr">→</span> رجوع لكل المقالات</a>
    </article>
  </div>
</section>
